# Run Python tests and browser regression checks on repository changes.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: node tests/dashboard_fallback.cjs
      - run: node tests/asset_picker.cjs
      - run: node tests/live_monitor.cjs
      - run: node tests/quote_monitor.cjs
      - run: node tests/research_ui.cjs
      - run: node tests/navigation.cjs
      - run: node tests/accounts_ui.cjs
