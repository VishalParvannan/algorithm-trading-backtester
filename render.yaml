# Always-on service with personal accounts. Review Render charges before creating.
services:
  - type: web
    name: backtest-lab
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: QUANTLAB_PUBLIC
        value: "1"
      - key: QUANTLAB_AUTH_MODE
        value: accounts
      - key: QUANTLAB_INVITATION_CODE
        value: quantbacktestlab
      - key: QUANTLAB_DB_PATH
        value: /var/data/quantlab.sqlite
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
    disk:
      name: backtest-data
      mountPath: /var/data
      sizeGB: 1
