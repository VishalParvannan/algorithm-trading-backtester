<!doctype html>
<!-- Account sign-in and registration; no personal workspace is loaded anonymously. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backtest Lab · Sign in</title><link rel="stylesheet" href="/style.css"><script src="/auth.js" defer></script></head><body class="login-page"><main class="login-card panel"><div class="eyebrow">BACKTEST LAB</div><h1>Your trading workspace</h1><p>Sign in to keep your experiments, settings, and paper portfolios in your own account.</p><form id="auth-form"><label>Username<input id="auth-username" autocomplete="username" minlength="3" maxlength="32" required></label><label>Password<input id="auth-password" type="password" autocomplete="current-password" maxlength="128" required></label><label id="invitation-label" hidden>Hosting invitation code<input id="auth-invitation" type="password" autocomplete="off"><span class="sensitivity-hint">Required for hosted registration; ask the person running the server.</span></label><button id="auth-submit" class="button primary" type="submit">Sign in</button><button id="auth-toggle" class="text-button" type="button">New here? Create an account</button><p id="auth-message" role="status" class="strategy-description"></p></form><p class="strategy-description">Usernames are case-insensitive. New passwords need at least 12 characters. There is no email password recovery yet.</p></main></body></html>
